<style>
  .cs-wrapper {
    --cs-gold: #c9a227;
    --cs-bg: #151515;
    --cs-surface: #1e1e1e;
    --cs-border: #2a2a2a;
    --cs-text: #ffffff;
    --cs-muted: #888888;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .cs-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--cs-muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cs-label span {
    color: var(--cs-text);
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
  }
  .cs-options {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .cs-option {
    position: relative;
  }
  .cs-option input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
  }
  .cs-option label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px 10px 14px;
    border: 1.5px solid var(--cs-border);
    border-radius: 10px;
    background: var(--cs-surface);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    user-select: none;
    position: relative;
  }
  .cs-option label:hover {
    border-color: rgba(201, 162, 39, 0.3);
    background: #252525;
  }
  .cs-option input:checked + label {
    border-color: var(--cs-gold);
    background: rgba(201, 162, 39, 0.06);
    box-shadow: 0 0 0 1px rgba(201, 162, 39, 0.15), 0 4px 16px rgba(201, 162, 39, 0.08);
  }
  .cs-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.08);
    transition: transform 0.25s ease;
  }
  .cs-option label:hover .cs-dot {
    transform: scale(1.12);
  }
  .cs-option input:checked + label .cs-dot {
    transform: scale(1);
    border-color: var(--cs-gold);
    box-shadow: 0 0 0 2px rgba(201, 162, 39, 0.2);
  }
  .cs-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--cs-muted);
    transition: color 0.25s ease;
  }
  .cs-option label:hover .cs-name {
    color: #ccc;
  }
  .cs-option input:checked + label .cs-name {
    color: var(--cs-text);
  }
  .cs-check {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--cs-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    margin-left: 2px;
    flex-shrink: 0;
  }
  .cs-option input:checked + label .cs-check {
    opacity: 1;
    transform: scale(1);
  }
  .cs-check svg {
    width: 10px;
    height: 10px;
    display: block;
  }
  .cs-option input:checked + label {
    animation: cs-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cs-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  @media (max-width: 480px) {
    .cs-options {
      gap: 8px;
    }
    .cs-option label {
      padding: 9px 14px 9px 12px;
    }
    .cs-dot {
      width: 16px;
      height: 16px;
    }
    .cs-name {
      font-size: 13px;
    }
  }
</style>

<div class="cs-wrapper">
  <div class="cs-label">
    Color: <span id="cs-selected">Black</span>
  </div>
  <div class="cs-options">
    <div class="cs-option">
      <input type="radio" name="cs-color" id="cs-black" value="Black" checked onchange="document.getElementById('cs-selected').textContent=this.value">
      <label for="cs-black">
        <span class="cs-dot" style="background:#1a1a1a;"></span>
        <span class="cs-name">Black</span>
        <span class="cs-check">
          <svg viewBox="0 0 12 12" fill="none">
            <path d="M2.5 6l2.5 2.5 4.5-5" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </label>
    </div>
    <div class="cs-option">
      <input type="radio" name="cs-color" id="cs-silver" value="Silver" onchange="document.getElementById('cs-selected').textContent=this.value">
      <label for="cs-silver">
        <span class="cs-dot" style="background:linear-gradient(135deg,#e8e8e8,#c0c0c0);"></span>
        <span class="cs-name">Silver</span>
        <span class="cs-check">
          <svg viewBox="0 0 12 12" fill="none">
            <path d="M2.5 6l2.5 2.5 4.5-5" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </label>
    </div>
  </div>
</div>
